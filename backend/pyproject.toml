[project]
name = "caredesk-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]  # generated by Alembic

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
