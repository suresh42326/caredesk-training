name: AI gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.306"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse fork pull requests (fail closed)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The AI gate only runs for pull requests inside this repository. Failing closed instead of skipping (a skipped required check counts as passing)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Review diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" | python scripts/ci_review.py haiku

